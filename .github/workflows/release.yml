name: Build and release Windows executable

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build and validate executable
        shell: pwsh
        run: |
          & .\build-locally\build.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "The local build script failed."
          }

      - name: Publish GitHub Release
        if: needs.release-please.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/pptx-to-letter-pdf.exe THIRD-PARTY-NOTICES.txt --clobber

      - name: Upload main-branch build artifact
        if: needs.release-please.outputs.release_created != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pptx-to-letter-pdf-windows-x64-${{ github.sha }}
          path: dist/pptx-to-letter-pdf.exe
          if-no-files-found: error
          retention-days: 14
