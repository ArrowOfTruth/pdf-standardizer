name: Build and release Windows executable

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Download, verify, and extract latest LibreOffice
        shell: pwsh
        run: |
          .\build-locally\prepare-libreoffice.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download, verify, and extract LibreOffice."
          }

      - name: Build executable with embedded LibreOffice
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile `
            --name pptx-to-letter-pdf `
            --add-data "dist\LibreOffice;LibreOffice" `
            convert_pptx_to_letter_pdf.py
          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller failed to bundle LibreOffice."
          }
          & "./dist/pptx-to-letter-pdf.exe" --help
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled executable failed its --help check."
          }

      - name: Test bundled conversion with fixture
        if: ${{ hashFiles('test-data/test.pptx') != '' }}
        shell: pwsh
        run: |
          $fixturePath = (Resolve-Path "test-data\test.pptx").Path
          & "./dist/pptx-to-letter-pdf.exe" $fixturePath --overwrite
          if ($LASTEXITCODE -ne 0) {
            throw "The bundled executable failed to convert the PowerPoint fixture."
          }
          & python -c "from pypdf import PdfReader; reader = PdfReader(r'test-data\test.note.taking.format.pdf'); assert len(reader.pages) > 0, 'Conversion produced an empty PDF'; print(f'Validated {len(reader.pages)} PDF pages')"
          if ($LASTEXITCODE -ne 0) {
            throw "The generated fixture PDF is invalid."
          }

      - name: Publish GitHub Release
        if: needs.release-please.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/pptx-to-letter-pdf.exe THIRD-PARTY-NOTICES.txt --clobber

      - name: Upload main-branch build artifact
        if: needs.release-please.outputs.release_created != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pptx-to-letter-pdf-windows-x64-${{ github.sha }}
          path: dist/pptx-to-letter-pdf.exe
          if-no-files-found: error
          retention-days: 14
